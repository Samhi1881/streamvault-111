[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamvault"
version = "0.1.0"
description = "Fault-tolerant, versioned data lake with adaptive checkpointing for financial transaction analytics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.0", "delta-spark==3.0.0"]
kafka = ["confluent-kafka>=2.3"]
monitoring = ["prometheus-client>=0.19"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]
all = ["streamvault[spark,kafka,monitoring,viz,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
